name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test conversion and library
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Build portable Windows app
        run: python build.py

      - name: Package complete app folder and checksum
        shell: pwsh
        run: |
          $archive = "CUBE-TO-XMP-${{ github.ref_name }}-windows-x64.zip"
          Compress-Archive -Path 'dist/CUBE-TO-XMP' -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/CUBE-TO-XMP-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: CUBE TO XMP ${{ github.ref_name }}
          body_path: docs/RELEASE_${{ github.ref_name }}.md
          files: |
            dist/CUBE-TO-XMP-*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
