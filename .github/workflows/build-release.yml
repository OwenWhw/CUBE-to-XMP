name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libnss3 libasound2t64

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install Linux Qt renderer
        if: runner.os == 'Linux'
        run: python -m pip install 'pywebview[qt]' PyQt6-WebEngine

      - name: Test conversion and library
        run: python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Build portable application
        run: python build.py

      - name: Check frozen Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/CUBE-TO-XMP/CUBE-TO-XMP.exe' -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }

      - name: Check frozen macOS application
        if: runner.os == 'macOS'
        run: dist/CUBE-TO-XMP.app/Contents/MacOS/CUBE-TO-XMP --self-test

      - name: Check frozen Linux application
        if: runner.os == 'Linux'
        run: dist/CUBE-TO-XMP/CUBE-TO-XMP --self-test

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = 'CUBE-TO-XMP-${{ github.ref_name }}-${{ matrix.target }}.zip'
          Compress-Archive -Path 'dist/CUBE-TO-XMP' -DestinationPath "dist/$archive" -Force
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "dist/$archive.sha256" -Encoding ascii

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: |
          archive='CUBE-TO-XMP-${{ github.ref_name }}-${{ matrix.target }}.zip'
          ditto -c -k --sequesterRsrc --keepParent dist/CUBE-TO-XMP.app "dist/$archive"
          cd dist && shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          archive='CUBE-TO-XMP-${{ github.ref_name }}-${{ matrix.target }}.zip'
          cd dist
          zip -qry "$archive" CUBE-TO-XMP
          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/CUBE-TO-XMP-*.zip
            dist/CUBE-TO-XMP-*.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify all four packages
        run: |
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 4
          cd dist
          cat *.zip.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: CUBE TO XMP ${{ github.ref_name }}
          body_path: docs/RELEASE_${{ github.ref_name }}.md
          files: |
            dist/CUBE-TO-XMP-*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
